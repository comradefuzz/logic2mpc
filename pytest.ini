[pytest]
# Общий набор проекта. Тесты спайков в проекте запрещены, тесты стори живут в story_tests/ и в общий набор не входят.
# Сьюты (docs/testing.md): smoke (метка smoke, на коммит) и full (всё, на /approve и /accept).
testpaths = tests scripts
norecursedirs = spikes story_tests .venv test-projects
markers =
    smoke: быстрый набор основных проверок для коммита
    build: сборка проекта MPC, контракт, просмотр собранного
    web: веб-слой редактора и стартового экрана
    core: анализ, план, правки, сессия
    tools: скрипты проекта (база знаний, реестр, gate)
